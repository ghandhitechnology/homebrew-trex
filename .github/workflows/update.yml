name: Update formula

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./update.sh
      - name: Commit if the release changed
        run: |
          git add Formula
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update trex to $(sed -n 's/^  version "\(.*\)"/\1/p' Formula/trex.rb)."
          git push
